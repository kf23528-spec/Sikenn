<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タップ切り替えガチャ</title>
  <style>
    :root{
      --bg0:#050816;
      --bg1:#09112b;
      --bg2:#101a3d;
      --panel:rgba(10,16,38,.82);
      --line:rgba(255,255,255,.10);
      --text:#e8eefc;
      --muted:#9fb0d0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(59,130,246,.25), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.22), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(16,185,129,.16), transparent 35%),
        linear-gradient(180deg,var(--bg0),var(--bg1) 45%,var(--bg2));
      overflow-x:hidden;
    }
    #fx{
      position:fixed; inset:0; width:100%; height:100%;
      pointer-events:none; z-index:40;
    }
    .bg-grid{
      position:fixed; inset:0; pointer-events:none; opacity:.18; z-index:0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at center, black 30%, transparent 95%);
    }
    .wrap{
      position:relative; z-index:2;
      width:min(1320px,100%);
      margin:0 auto;
      padding:20px;
      display:grid;
      grid-template-columns: 1.18fr .82fr;
      gap:18px;
    }
    .card{
      background:linear-gradient(180deg,var(--panel),rgba(8,12,28,.92));
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow:0 24px 80px rgba(0,0,0,.38);
      backdrop-filter: blur(12px);
      overflow:hidden;
    }
    .main,.side{padding:22px}
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:clamp(28px,4vw,46px);
      line-height:1.05;
      letter-spacing:.04em;
    }
    .sub{
      margin-top:8px;
      color:var(--muted);
      line-height:1.65;
      font-size:14px;
    }
    .badge{
      padding:10px 14px;
      border-radius:999px;
      white-space:nowrap;
      background:rgba(125,211,252,.10);
      border:1px solid rgba(125,211,252,.22);
      color:#c9f0ff;
      font-size:13px;
    }

    .stage{
      position:relative;
      min-height:520px;
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.10), transparent 30%),
        linear-gradient(180deg, rgba(17,24,42,.98), rgba(8,12,25,.96));
      border:1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 20px 60px rgba(0,0,0,.34);
      overflow:hidden;
      cursor:pointer;
      user-select:none;
    }
    .stage::before{
      content:"";
      position:absolute; inset:-20%;
      background:
        radial-gradient(circle at 50% 50%, rgba(125,211,252,.08), transparent 30%),
        radial-gradient(circle at 35% 35%, rgba(168,85,247,.12), transparent 22%),
        radial-gradient(circle at 65% 65%, rgba(16,185,129,.10), transparent 22%);
      filter:blur(20px);
      animation: drift 16s linear infinite;
    }
    @keyframes drift{
      0%{transform:translate3d(0,0,0) scale(1)}
      50%{transform:translate3d(20px,-10px,0) scale(1.05)}
      100%{transform:translate3d(0,0,0) scale(1)}
    }

    .video-overlay{
      position:absolute;
      inset:0;
      z-index:30;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      background:rgba(0,0,0,.20);
    }
    .video-overlay.on{
      opacity:1;
      pointer-events:auto;
    }
    .video-panel{
      width:100%;
      height:100%;
      position:relative;
      background:#000;
    }
    .video-panel video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .video-text{
      position:absolute;
      left:18px;
      top:18px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.52);
      border:1px solid rgba(255,255,255,.12);
      font-size:12px;
      letter-spacing:.08em;
    }
    .skip{
      position:absolute;
      right:16px;
      bottom:16px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.52);
      border:1px solid rgba(255,255,255,.12);
      font-size:12px;
      color:#fff;
    }

    .result-shell{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index:6;
      padding:18px;
    }
    .result-card{
      width:min(760px, 96%);
      border-radius:30px;
      overflow:hidden;
      background:rgba(6,10,22,.76);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 22px 62px rgba(0,0,0,.32);
      backdrop-filter: blur(12px);
      transform:translateY(0) scale(1);
      transition:transform .2s ease, filter .2s ease, opacity .2s ease;
      position:relative;
    }
    .result-card.pop{
      transform:translateY(-5px) scale(1.02);
      filter:brightness(1.1) saturate(1.06);
    }

    .portrait-wrap{
      position:relative;
      height:360px;
      background:
        radial-gradient(circle at 50% 36%, rgba(255,255,255,.16), transparent 18%),
        radial-gradient(circle at 50% 62%, rgba(125,211,252,.12), transparent 30%),
        linear-gradient(180deg, rgba(12,18,40,.94), rgba(5,8,16,.98));
      overflow:hidden;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .portrait-bg{
      position:absolute;
      inset:0;
    }
    .portrait-bg img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter:saturate(1.05) contrast(1.03);
    }
    .portrait-glass{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 25%),
        radial-gradient(circle at 50% 70%, rgba(255,255,255,.08), transparent 30%);
      mix-blend-mode:screen;
      pointer-events:none;
    }
    .tap-hint{
      position:absolute;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      padding:10px 14px;
      border-radius:999px;
      background:rgba(0,0,0,.52);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:12px;
      letter-spacing:.08em;
      z-index:3;
    }
    .slot-counter{
      position:absolute;
      right:14px;
      top:14px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.52);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:12px;
      letter-spacing:.08em;
      z-index:3;
    }

    .meta{
      padding:16px 18px 18px;
    }
    .rarity-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:140px;
      padding:8px 16px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.14em;
      margin-bottom:12px;
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      color:#fff;
    }
    .name{
      font-size:clamp(24px,3.2vw,38px);
      font-weight:1000;
      line-height:1.05;
      margin:0 0 8px;
    }
    .subline{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      min-height:48px;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-top:16px;
    }
    button{
      border:none;
      cursor:pointer;
      border-radius:16px;
      padding:14px 20px;
      min-width:150px;
      font-size:16px;
      font-weight:800;
      color:#fff;
      transition:transform .15s ease, filter .15s ease, opacity .15s ease;
      box-shadow:0 12px 22px rgba(0,0,0,.18);
    }
    button:hover{transform:translateY(-1px);filter:brightness(1.08)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn1{background:linear-gradient(180deg,#2563eb,#1d4ed8)}
    .btn2{background:linear-gradient(180deg,#7c3aed,#6d28d9)}
    .btn3{background:linear-gradient(180deg,#059669,#047857)}
    .btn4{background:linear-gradient(180deg,#ef4444,#b91c1c)}

    .section{
      margin-top:14px;
      padding:16px;
      border-radius:20px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.07);
    }
    .section h2{margin:0 0 12px; font-size:18px;}
    .history-list,.prob-list{
      display:grid;
      gap:10px;
      max-height:280px;
      overflow:auto;
      padding-right:6px;
    }
    .history-item,.prob-row{
      border-radius:14px;
      background:rgba(10,16,38,.55);
      border:1px solid rgba(255,255,255,.06);
      padding:12px 14px;
    }
    .history-item{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      font-size:14px;
    }
    .history-item small{color:var(--muted)}
    .prob-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-size:14px;
      font-weight:700;
    }
    .bar{
      margin-top:8px;
      height:8px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }
    .fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(125,211,252,.95), rgba(168,85,247,.95));
      width:50%;
    }
    .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
    .stat{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.07);
    }
    .label{color:var(--muted);font-size:12px;margin-bottom:6px}
    .value{font-size:24px;font-weight:900}
    .note{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }
    .lineup{
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:10px;
      margin-top:10px;
    }
    .slot{
      min-height:128px;
      border-radius:16px;
      padding:10px;
      background:rgba(6,10,22,.55);
      border:1px solid rgba(255,255,255,.07);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:8px;
      cursor:pointer;
    }
    .slot.active{
      box-shadow:0 0 0 1px rgba(255,255,255,.18) inset, 0 0 24px rgba(255,255,255,.10);
      transform:translateY(-1px);
    }
    .slot .no{font-size:11px; color:var(--muted)}
    .slot .nm{font-size:13px; font-weight:900; line-height:1.2}
    .slot .rt{font-size:11px; opacity:.9}
    .slot .mini{
      width:100%;
      aspect-ratio:1.35/1;
      border-radius:12px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
    }
    .slot .mini img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .burst{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:50;
      opacity:0;
      background:radial-gradient(circle at center, rgba(255,255,255,.92), rgba(255,255,255,.16) 16%, rgba(255,255,255,0) 42%);
      mix-blend-mode:screen;
    }
    .burst.on{animation:burst .46s ease}
    @keyframes burst{
      0%{opacity:0;transform:scale(.92)}
      15%{opacity:.92;transform:scale(1)}
      100%{opacity:0;transform:scale(1.12)}
    }
    .shake{animation:shake .45s ease}
    @keyframes shake{
      0%{transform:translate(0,0) scale(1)}
      15%{transform:translate(-4px,2px) scale(1.02)}
      30%{transform:translate(4px,-2px) scale(1.03)}
      45%{transform:translate(-3px,-2px) scale(1.02)}
      60%{transform:translate(3px,3px) scale(1.03)}
      100%{transform:translate(0,0) scale(1)}
    }
    .rarity-common{background:#6b7280}
    .rarity-uncommon{background:#10b981}
    .rarity-rare{background:#3b82f6}
    .rarity-sr{background:#8b5cf6}
    .rarity-epic{background:#ec4899}
    .rarity-ultra{background:#f59e0b; color:#111827}
    .rarity-legend{background:#ef4444}
    .rarity-mythic{background:linear-gradient(90deg,#fb7185,#f59e0b,#facc15); color:#111827;}
    .rarity-ancient{background:linear-gradient(90deg,#22c55e,#06b6d4,#8b5cf6);}
    .rarity-divine{background:linear-gradient(90deg,#e879f9,#93c5fd,#fda4af); color:#111827;}
    .rarity-celestial{background:linear-gradient(90deg,#ffffff,#93c5fd,#38bdf8); color:#111827;}
    .rarity-omega{background:linear-gradient(90deg,#111827,#7c3aed,#0ea5e9);}
    .rarity-genesis{background:linear-gradient(90deg,#f97316,#facc15,#22c55e,#38bdf8,#a855f7); color:#111827;}
    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr}
      .lineup{grid-template-columns:repeat(2, 1fr)}
    }
    @media (max-width: 560px){
      .main,.side{padding:16px}
      .topbar{flex-direction:column}
      .stats{grid-template-columns:1fr}
      button{width:100%}
      .lineup{grid-template-columns:1fr}
      .portrait-wrap{height:320px}
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="bg-grid"></div>
  <div class="burst" id="burst"></div>

  <div class="wrap">
    <section class="card main">
      <div class="topbar">
        <div>
          <h1>キャラ召喚ガチャ</h1>
          <div class="sub">
            最初の1回だけフル映像。<br>
            そのあとはカードをタップして、次のキャラへ切り替えていく。
          </div>
        </div>
        <div class="badge">未所持・所持の管理なし</div>
      </div>

      <div class="stage" id="stage">
        <div class="video-overlay" id="videoOverlay">
          <div class="video-panel">
            <video id="gachaVideo" playsinline muted preload="auto"></video>
            <div class="video-text">FULL REVEAL SEQUENCE</div>
            <div class="skip">最初だけフル映像</div>
          </div>
        </div>

        <div class="result-shell">
          <div class="result-card" id="resultCard">
            <div class="portrait-wrap">
              <div class="portrait-bg" id="portraitBg"></div>
              <div class="slot-counter" id="slotCounter">0 / 0</div>
              <div class="tap-hint" id="tapHint">タップで次へ</div>
              <div class="portrait-glass"></div>
            </div>
            <div class="meta">
              <div id="rarityPill" class="rarity-pill rarity-common">COMMON</div>
              <div id="charName" class="name">ガチャを引こう</div>
              <div id="charSub" class="subline">最初は動画が流れ、その後はタップで切り替え。</div>
              <div class="controls">
                <button class="btn1" id="pull1">1回引く</button>
                <button class="btn2" id="pull10">10連</button>
                <button class="btn3" id="loadVideo">動画を読み込む</button>
                <button class="btn4" id="reset">リセット</button>
              </div>
              <input id="videoInput" type="file" accept="video/*" hidden />
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>10連ラインナップ</h2>
        <div class="lineup" id="lineup"></div>
      </div>

      <div class="section">
        <h2>履歴</h2>
        <div class="history-list" id="history"></div>
      </div>
    </section>

    <aside class="card side">
      <div class="stats">
        <div class="stat">
          <div class="label">総回数</div>
          <div class="value" id="totalCount">0</div>
        </div>
        <div class="stat">
          <div class="label">最高レア</div>
          <div class="value" id="bestRarity">-</div>
        </div>
      </div>

      <div class="section">
        <h2>レアリティ確率</h2>
        <div class="prob-list" id="probList"></div>
        <div class="note">
          合計100%。上位5種はかなり低確率。<br>
          初回だけフル映像、それ以降はテンポ重視のタップ切り替え。
        </div>
      </div>
    </aside>
  </div>

  <script>
    const VIDEO_SRC = "gacha.mp4";

    const rarities = [
      { key:"common", label:"COMMON", rate:44, cls:"rarity-common", desc:"よく出る基本枠。", glow:"#6b7280" },
      { key:"uncommon", label:"UNCOMMON", rate:24, cls:"rarity-uncommon", desc:"少し嬉しい中堅枠。", glow:"#10b981" },
      { key:"rare", label:"RARE", rate:15, cls:"rarity-rare", desc:"ここから当たり感が出る。", glow:"#3b82f6" },
      { key:"sr", label:"SUPER RARE", rate:8, cls:"rarity-sr", desc:"画面の気持ちよさが上がる枠。", glow:"#8b5cf6" },
      { key:"epic", label:"EPIC", rate:4.5, cls:"rarity-epic", desc:"かなりテンションが上がる。", glow:"#ec4899" },
      { key:"ultra", label:"ULTRA RARE", rate:2.5, cls:"rarity-ultra", desc:"ここから演出がかなり熱い。", glow:"#f59e0b" },
      { key:"legend", label:"LEGEND", rate:1.2, cls:"rarity-legend", desc:"出たらかなり気持ちいい枠。", glow:"#ef4444" },
      { key:"mythic", label:"MYTHIC", rate:0.5, cls:"rarity-mythic", desc:"かなり低確率の特別枠。", glow:"#f97316" },
      { key:"ancient", label:"ANCIENT", rate:0.2, cls:"rarity-ancient", desc:"古代級。かなり珍しい。", glow:"#22c55e" },
      { key:"divine", label:"DIVINE", rate:0.07, cls:"rarity-divine", desc:"神域の領域。激レア。", glow:"#e879f9" },
      { key:"celestial", label:"CELESTIAL", rate:0.02, cls:"rarity-celestial", desc:"天体級。見た目も強い。", glow:"#93c5fd" },
      { key:"omega", label:"OMEGA", rate:0.005, cls:"rarity-omega", desc:"ほぼ見ない超上位枠。", glow:"#7c3aed" },
      { key:"genesis", label:"GENESIS", rate:0.005, cls:"rarity-genesis", desc:"最上位。完全に別格。", glow:"#facc15" }
    ];

    const namePool = {
      common:["ルカ","ミナ","ハル","レイ","ノア","シロ","ユイ","アオ","ナギ","ソラ"],
      uncommon:["カイ","セナ","リオ","ユナ","ヒナ","トワ","コウ","マオ","ミオ","レン"],
      rare:["アリア","シオン","カナタ","リク","イオ","サラ","ユウト","アキ","セラ","ハルト"],
      sr:["エル","セリス","ジン","ルナ","クロエ","ユリカ","レオン","ミレイ","アズサ","カナデ"],
      epic:["ゼノ","ミラ","カイト","シズク","リリア","オウガ","レイナ","アスト","テオ","ノエル"],
      ultra:["ヴァル","イリス","ゼファ","セレス","オルカ","フィア","アルト","ルシア","イグニ","ネモ"],
      legend:["アルテ","ラグナ","ノクス","エリス","ガイア","アーク","フェル","カロン","ミスラ","レアル"],
      mythic:["クロノ","アダム","イブ","オリオン","ゼル","アトラ","ミカエル","サタン","イザナ","オルフェ"],
      ancient:["プロト","メノン","エーテル","タルタ","ユグ","カオス","セイヴ","ドレイ","アポカ","レム"],
      divine:["セラフィ","ガブリ","ラファ","アマテ","ミカ","ルシフ","ミトラ","ヴェスタ","アスタ","ソフィ"],
      celestial:["ステラ","ネビュラ","ギャラク","ルミナ","コスモ","アルカ","オービタ","シグナ","プルート","アストラ"],
      omega:["Ωゼロ","Ωノヴァ","Ωレイ","Ωルクス","Ωアーク","Ωカオス","Ωシン","Ωイオ","Ωフレア","Ωニル"],
      genesis:["ジェネシス","プロジェネ","ゼロアーク","ファーストライト","コア=0","アザースタート","オリジン","ビギン","創世核","始点"]
    };

    const classPool = {
      common:["短剣使い","旅人","見習い術士","傭兵","機械工","探索者"],
      uncommon:["剣士","狩人","祈祷師","盾役","風使い","錬金術師"],
      rare:["雷槍騎士","影刃","魔導士","航海士","結界師","双剣士"],
      sr:["守護騎士","星読み","炎舞使い","聖堂騎士","氷結術師","機動剣士"],
      epic:["天翼槍士","幻影術師","紅蓮剣姫","月光弓師","時砂操者","黒曜守衛"],
      ultra:["虚空断罪者","黄金聖槍士","龍鱗装騎","灼熱審判官","封印執行者","覇王銃士"],

    function ensureAudio(){
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function tone(freq, dur = 0.08, type = "sine", gain = 0.04){
      ensureAudio();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }
    function sweep(){
      tone(120, 0.08, "triangle", 0.03);
      setTimeout(() => tone(170, 0.08, "triangle", 0.03), 35);
      setTimeout(() => tone(220, 0.08, "triangle", 0.03), 70);
    }
    function hitSound(rank){
      const base = 240 + rank * 50;
      tone(base, 0.12, "sine", 0.05);
      setTimeout(() => tone(base * 1.35, 0.10, "triangle", 0.04), 45);
      setTimeout(() => tone(base * 2, 0.14, "sawtooth", 0.025), 95);
    }

    function buildProb(){
      probList.innerHTML = "";
      rarities.forEach((r) => {
        const row = document.createElement("div");
        row.className = "prob-row";
        const odds = r.rate >= 1 ? `約1/${Math.round(100 / r.rate)}` : `約1/${Math.round(100 / r.rate).toLocaleString()}`;
        row.innerHTML = `
          <div class="prob-top">
            <div>${r.label}</div>
            <div>${r.rate}% / ${odds}</div>
          </div>
          <div class="bar"><div class="fill" style="width:${Math.max(r.rate * 3.4, 1)}%"></div></div>
        `;
        probList.appendChild(row);
      });
    }

    function pickRarity(){
      const totalRate = rarities.reduce((a,r) => a + r.rate, 0);
      let roll = Math.random() * totalRate;
      for (const r of rarities){
        roll -= r.rate;
        if (roll <= 0) return r;
      }
      return rarities[rarities.length - 1];
    }

    function rand(arr){ return arr[(Math.random() * arr.length) | 0]; }
    function seededSeed(){ return Math.floor(Math.random() * 1e9); }
    function mulberry32(a){
      return function(){
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

    function buildPortraitSVG(ch){

      const borderGlow = ch.rarity.key === "genesis" ? "0 0 40px rgba(250,204,21,.45)" : "0 0 26px rgba(255,255,255,.18)";

      const svg = `

        <path d="M202 ${mouthY} C208 ${mouthY+4}, 212 ${mouthY+4}, 218 ${mouthY}" fill="none" stroke="#3f2b20" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M144 214 C162 188, 176 176, 210 176 C244 176, 258 188, 276 214 L294 314 C260 326, 238 328, 210 328 C182 328, 160 326, 126 314 Z" fill="url(#cloth)"/>
        <path d="M182 190 C192 198, 228 198, 238 190 L244 216 C233 222, 226 224, 210 224 C194 224, 187 222, 176 216 Z" fill="${ch.glow}" opacity=".22"/>
        <path d="${armLeft}" fill="none" stroke="${skin}" stroke-width="18" stroke-linecap="round"/>

        ${weapon === 0 ? `

    function makeCharacter(rarity){
      const name = rand(namePool[rarity.key]);
      const role = rand(classPool[rarity.key]);
      const desc = rand(descPool[rarity.key]);
      const ch = { name, role, desc, rarity: rarity };
      ch.svg = buildPortraitSVG(ch);
      return ch;
    }

    function addHistory(rarity, ch){
      const el = document.createElement("div");
      el.className = "history-item";
      el.innerHTML = `
        <div><strong>${rarity.label}</strong> / ${esc(ch.name)} · ${esc(ch.role)}</div>
        <small>${new Date().toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit", second:"2-digit"})}</small>
      `;
      history.prepend(el);
      while (history.children.length > 20) history.removeChild(history.lastChild);
    }

    function updateStats(rarity){
      total++;
      totalCount.textContent = total;
      const rank = rarities.findIndex(r => r.key === rarity.key);
      if (rank > bestIndex){
        bestIndex = rank;
        bestRarity.textContent = rarity.label;
      }
    }

    function makeParticles(){
      const rect = stage.getBoundingClientRect();
      const px = (rect.left + rect.width / 2) * devicePixelRatio;
      const py = (rect.top + rect.height / 2) * devicePixelRatio;
      const colors = ["#ffffff","#93c5fd","#e879f9","#facc15","#34d399"];
      for (let i = 0; i < 110; i++){
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 9;
        particles.push({
          x:px, y:py, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 2.5, g:0.10 * devicePixelRatio,
          life:46 + Math.random() * 30, r:(2 + Math.random() * 4) * devicePixelRatio,
          color:colors[(Math.random() * colors.length) | 0], rot:Math.random() * Math.PI
        });
      }
    }

    function drawParticles(){
      ctx.clearRect(0,0,fx.width,fx.height);
      for (let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        p.vx *= 0.986; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / 70);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot += 0.08);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.roundRect(-p.r, -p.r * .55, p.r * 2, p.r * 1.1, Math.max(2, p.r * .3));
        ctx.fill();
        ctx.restore();
        if (p.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(drawParticles);
    }
    requestAnimationFrame(drawParticles);

    function showBurst(){
      burst.classList.remove("on");
      void burst.offsetWidth;
      burst.classList.add("on");
    }

    function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function playIntroVideo(){
      if (introPlayed) return;
      videoOverlay.classList.add("on");
      video.currentTime = 0;
      video.playbackRate = 1;
      try{
        await video.play();
      }catch(e){}
      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 8;
      await wait(Math.ceil(duration * 1000) + 140);
      video.pause();
      videoOverlay.classList.remove("on");
      introPlayed = true;
    }

    function renderCurrent(){
      if (!currentPack.length){
        portraitBg.innerHTML = "";
        rarityPill.className = "rarity-pill rarity-common";
        rarityPill.textContent = "COMMON";
        charName.textContent = "ガチャを引こう";
        charSub.textContent = "最初は動画が流れ、その後はタップで切り替え。";
        slotCounter.textContent = "0 / 0";
        tapHint.textContent = "タップで次へ";
        return;
      }
      const ch = currentPack[currentIndex];
      portraitBg.innerHTML = `<img alt="${esc(ch.name)}" src="${ch.svg}">`;
      rarityPill.className = `rarity-pill ${ch.rarity.cls}`;
      rarityPill.textContent = ch.rarity.label;
      charName.textContent = ch.name;
      charSub.textContent = `${ch.role} · ${ch.desc}`;
      slotCounter.textContent = `${currentIndex + 1} / ${currentPack.length}`;
      tapHint.textContent = currentIndex < currentPack.length - 1 ? "タップで次のキャラ" : "最後まで見たら再抽選";
      resultCard.classList.remove("pop","shake");
      void resultCard.offsetWidth;
      resultCard.classList.add("pop","shake");
      showBurst();
      makeParticles();
      hitSound(rarities.findIndex(r => r.key === ch.rarity.key));
      const slots = lineup.querySelectorAll(".slot");
      slots.forEach((s, i) => s.classList.toggle("active", i === currentIndex));
    }

    function buildLineup(){
      lineup.innerHTML = "";
      currentPack.forEach((ch, idx) => {
        const slot = document.createElement("div");
        slot.className = "slot" + (idx === currentIndex ? " active" : "");
        slot.innerHTML = `
          <div class="no">#${idx + 1}</div>
          <div class="mini"><img alt="${esc(ch.name)}" src="${ch.svg}"></div>
          <div>
            <div class="nm">${esc(ch.name)}</div>
            <div class="rt">${ch.rarity.label}</div>
          </div>
          <div class="rt">${esc(ch.role)}</div>
        `;
        slot.addEventListener("click", (e) => {
          e.stopPropagation();
          currentIndex = idx;
          renderCurrent();
        });
        lineup.appendChild(slot);
      });
    }

    function makePack(count){
      currentMode = count;
      currentPack = Array.from({length: count}, () => {
        const rarity = pickRarity();
        const ch = makeCharacter(rarity);
        updateStats(rarity);
        addHistory(rarity, ch);
        return ch;
      });
      currentIndex = 0;
      buildLineup();
      renderCurrent();
    }

    async function startDraw(count){
      if (busy) return;
      busy = true;
      setButtons(true);

      sweep();
      if (!introPlayed){
        await playIntroVideo();
      }

      makePack(count);
      busy = false;
      setButtons(false);
    }

    function nextTap(){
      if (busy || !currentPack.length) return;
      if (currentIndex < currentPack.length - 1){
        currentIndex++;
        renderCurrent();
      } else {
        makePack(currentMode);
      }
    }

    function setButtons(state){
      pull1.disabled = state;
      pull10.disabled = state;
      loadVideo.disabled = state;
      resetBtn.disabled = state;
    }

    function resetAll(){
      if (busy) return;
      total = 0;
      bestIndex = -1;
      introPlayed = false;
      currentPack = [];
      currentIndex = 0;
      currentMode = 1;
      totalCount.textContent = "0";
      bestRarity.textContent = "-";
      history.innerHTML = "";
      lineup.innerHTML = "";
      portraitBg.innerHTML = "";
      rarityPill.className = "rarity-pill rarity-common";
      rarityPill.textContent = "COMMON";
      charName.textContent = "ガチャを引こう";
      charSub.textContent = "最初は動画が流れ、その後はタップで切り替え。";
      slotCounter.textContent = "0 / 0";
      tapHint.textContent = "タップで次へ";
      resultCard.classList.remove("pop","shake");
    }

    loadVideo.addEventListener("click", () => videoInput.click());
    videoInput.addEventListener("change", () => {
      const file = videoInput.files && videoInput.files[0];
      if (!file) return;
      if (currentVideoObjectURL) URL.revokeObjectURL(currentVideoObjectURL);
      currentVideoObjectURL = URL.createObjectURL(file);
      video.src = currentVideoObjectURL;
      video.load();
    });

    pull1.addEventListener("click", () => startDraw(1));
    pull10.addEventListener("click", () => startDraw(10));
    resetBtn.addEventListener("click", resetAll);
    stage.addEventListener("click", () => {
      if (videoOverlay.classList.contains("on")) return;
      nextTap();
    });

    buildProb();
