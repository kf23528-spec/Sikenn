<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FBX Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ui {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    #file {
      color: #fff;
      max-width: 260px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      background: #2e7dff;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      color: rgba(255,255,255,.8);
      background: rgba(20,20,20,.55);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <input id="file" type="file" accept=".fbx" />
    <button id="playBtn" disabled>再生</button>
    <button id="pauseBtn" disabled>停止</button>
  </div>
  <div id="hint">FBXを読み込むと自動で表示します。上半身は固定されたまま、入っているアニメーションをループ再生します。</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 1.6, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(3, 8, 5);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
    grid.position.y = 0;
    scene.add(grid);

    let model = null;
    let mixer = null;
    let clock = new THREE.Clock();
    let currentAction = null;

    const fileInput = document.getElementById('file');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    function clearModel() {
      if (model) {
        scene.remove(model);
        model.traverse((obj) => {
          if (obj.isMesh) {
            obj.geometry?.dispose?.();
            if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose?.());
            else obj.material?.dispose?.();
          }
        });
      }
      model = null;
      mixer = null;
      currentAction = null;
      playBtn.disabled = true;
      pauseBtn.disabled = true;
    }

    function frameModel(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      object.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.2 / maxDim;
      object.scale.setScalar(scale);
      object.position.y += size.y * scale * 0.5;

      controls.target.set(0, size.y * scale * 0.5, 0);
      controls.update();
    }

    function loadFBXFromUrl(url) {
      clearModel();
      const loader = new FBXLoader();
      loader.load(url, (object) => {
        model = object;
        scene.add(model);
        frameModel(model);

        mixer = new THREE.AnimationMixer(model);
        if (model.animations && model.animations.length > 0) {
          currentAction = mixer.clipAction(model.animations[0]);
          currentAction.reset();
          currentAction.setLoop(THREE.LoopRepeat);
          currentAction.play();
          playBtn.disabled = false;
          pauseBtn.disabled = false;
        } else {
          playBtn.disabled = true;
          pauseBtn.disabled = true;
          console.warn('このFBXにはアニメーションが入っていません。');
        }
      }, undefined, (err) => {
        console.error(err);
        alert('FBXの読み込みに失敗しました。');
      });
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadFBXFromUrl(url);
    });

    playBtn.addEventListener('click', () => {
      if (currentAction) currentAction.paused = false;
    });

    pauseBtn.addEventListener('click', () => {
      if (currentAction) currentAction.paused = true;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 同じフォルダに poli_walk_static_upper.fbx を置いた場合は自動で読み込む
    loadFBXFromUrl('./poli_walk_static_upper.fbx');
  </script>
</body>
</html>
